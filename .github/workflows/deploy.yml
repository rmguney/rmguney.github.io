name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check and clean configs
        run: |
          echo "Checking Next.js configuration files:"
          ls -la next.config.*
          echo "Contents of next.config.mjs:"
          cat next.config.mjs
          if [ -f "next.config.js" ]; then
            echo "WARNING: Removing conflicting next.config.js"
            rm -f next.config.js
          fi

      - name: Build with Next.js
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          echo "Starting Next.js build..."
          npm run build
          echo "Build completed!"

      - name: List build output
        run: |
          echo "Listing root directory:"
          ls -la ./
          echo "Checking for out directory:"
          if [ -d "./out" ]; then
            echo "Out directory exists"
            echo "Contents of out directory:"
            ls -la ./out
          else
            echo "Out directory does not exist"
            echo "Checking .next directory contents:"
            ls -la .next/ || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
