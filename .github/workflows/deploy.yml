name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.freshness.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate repo data
        env:
          BALLOON_SEED: ${{ secrets.BALLOON_SEED }}
        run: npm run data

      - name: Check freshness
        id: freshness
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new=$(jq -r .hash public/data-manifest.json)
          old=$(curl -fsSL https://rmguney.github.io/data-manifest.json 2>/dev/null | jq -r .hash 2>/dev/null || true)
          echo "new=$new"
          echo "old=$old"
          if [ -n "$new" ] && [ "$new" = "$old" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Data unchanged; skipping build and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Vite
        if: steps.freshness.outputs.changed == 'true'
        run: npx vite build

      - name: List build output
        if: steps.freshness.outputs.changed == 'true'
        run: ls -la ./dist

      - name: Upload Pages artifact
        if: steps.freshness.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
